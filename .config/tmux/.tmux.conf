# -- Básicos --
set-option -g prefix C-b
bind C-b send-prefix
set -g history-limit 10000
set -g mouse on
setw -g mode-keys vi

# No salir del modo copia ni saltar al fondo al soltar la selección con el ratón
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane

# Portapapeles del sistema (OSC 52)
set -s set-clipboard on

# Copiar con Click Derecho o con 'y' (Vim) sin que te expulse al fondo
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode MouseDown3Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear

# -- Pane movement estilo Vim --
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind p
# new session
bind p new-session
#kill and change the actual session
bind W run-shell "tmux switch-client -n 2>/dev/null && tmux kill-session -t $(tmux display-message -p '#S')"

bind N previous-window


# Mover panel actual a la siguiente ventana
bind m run-shell "tmux move-pane -t:+1"

# Recargar config con 'prefix + r'
bind r source-file ~/dotfiles/.config/tmux/.tmux.conf \; display-message "Config reloaded!"

# -- Compatibilidad y colores (Cyberdream-friendly) --
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",screen-256color:RGB"
# set-option -g xterm-keys on
set-option -g backspace C-h

# -- Estilo de barra inferior --
set -g status-bg black
set -g status-fg white
set -g status-left "#[fg=green]#S"
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M:%S"

# -- Bordes de paneles --
set -g pane-border-style fg=grey
set -g pane-active-border-style fg=brightblue
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour121

# -- Nombres de ventana --
setw -g window-status-format "#[fg=colour242]#I:#W"
setw -g window-status-current-format "#[fg=colour121,bold]#I:#W"

# Barra de estado transparente
set -g status on
set -g status-bg default
set -g status-style bg=default,fg=white

# Parte izquierda (nombre de la sesión con borde visual)
set -g status-left "#[fg=violet]#S #[fg=grey]|#[default] "

# Parte derecha (fecha/hora con separación)
set -g status-right "#[fg=violet]%a %d %b #[fg=violet]%I:%M %p"

# Estilo de pestañas de ventana
setw -g window-status-current-format "#[fg=violet,bold]#I:#W |"
setw -g window-status-format "#[fg=grey]#I:#W |"

# Plugin Manager Path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/dotfiles/.config/tmux/.tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'noscript/tmux-mighty-scroll'

# Configuración tmux-mighty-scroll
set -g @mighty-scroll-interval 3

# autosave cada 5 minutos
set -g @continuum-save-interval '5'

# restore automático al iniciar tmux
set -g @continuum-restore 'on'
set -g @resurrect-processes 'antigravity "~antigravity" agy "~agy" "npm run dev" "pnpm run dev" "pnpm dev" "pnpm run dev" "php artisan serve"'
# Restaura el contenido y texto visible de cada pane
set -g @resurrect-capture-pane-contents 'on'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/dotfiles/.config/tmux/.tmux/plugins/tpm/tpm'


