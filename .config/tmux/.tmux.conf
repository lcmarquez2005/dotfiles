# -- Básicos --
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g history-limit 10000
set -g mouse on

# -- Pane movement estilo Vim --
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mover panel actual a la siguiente ventana
bind m run-shell "tmux move-pane -t:+1"

# Recargar config con 'prefix + r'
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# -- Compatibilidad y colores (Cyberdream-friendly) --
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",screen-256color:RGB"
# set-option -g xterm-keys on
set-option -g backspace C-h

# -- Estilo de barra inferior --
set -g status-bg black
set -g status-fg white
set -g status-left "#[fg=green]#S"
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M:%S"

# -- Bordes de paneles --
set -g pane-border-style fg=grey
set -g pane-active-border-style fg=brightblue
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour121

# -- Nombres de ventana --
setw -g window-status-format "#[fg=colour242]#I:#W"
setw -g window-status-current-format "#[fg=colour121,bold]#I:#W"

# Barra de estado transparente
set -g status on
set -g status-bg default
set -g status-style bg=default,fg=white

# Parte izquierda (nombre de la sesión con borde visual)
set -g status-left "#[fg=violet]#S #[fg=grey]|#[default] "

# Parte derecha (fecha/hora con separación)
set -g status-right "#[fg=violet]%a %d %b #[fg=violet]%I:%M %p"

# Estilo de pestañas de ventana
setw -g window-status-current-format "#[fg=violet,bold]#I:#W |"
setw -g window-status-format "#[fg=grey]#I:#W |"

